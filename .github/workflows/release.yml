name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/tordeX.Desktop/tordeX.Desktop.csproj

      - name: Build
        run: dotnet build src/tordeX.Desktop/tordeX.Desktop.csproj -c Release --no-restore

      - name: Test
        run: dotnet test src/tordeX.Tests/tordeX.Tests.csproj -c Release --verbosity normal

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "name=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Publish (Self-Contained Single File)
        shell: bash
        run: |
          dotnet publish src/tordeX.Desktop/tordeX.Desktop.csproj \
            -c Release \
            --self-contained \
            -r win-x64 \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version=${{ steps.version.outputs.name }} \
            -o publish

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $zipName = "tordeX-${{ steps.version.outputs.name }}-win-x64.zip"
          Compress-Archive -Path "publish\*" -DestinationPath $zipName -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tordeX-win-x64
          path: tordeX-*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/tordeX.Linux/tordeX.Linux.csproj

      - name: Build
        run: dotnet build src/tordeX.Linux/tordeX.Linux.csproj -c Release --no-restore

      - name: Test
        run: dotnet test src/tordeX.Tests/tordeX.Tests.csproj -c Release --verbosity normal

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "name=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Publish (Self-Contained Single File)
        shell: bash
        run: |
          dotnet publish src/tordeX.Linux/tordeX.Linux.csproj \
            -c Release \
            --self-contained \
            -r linux-x64 \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version=${{ steps.version.outputs.name }} \
            -o publish

      - name: Create tar.gz archive
        shell: bash
        run: |
          tar -czf "tordeX-${{ steps.version.outputs.name }}-linux-x64.tar.gz" -C publish .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tordeX-linux-x64
          path: tordeX-*.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "name=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: tordeX ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## tordeX ${{ steps.version.outputs.tag }}

            Decentralized E2E encrypted messenger over Tor.

            ### Downloads

            | Platform | File |
            |----------|------|
            | Windows x64 | `tordeX-${{ steps.version.outputs.name }}-win-x64.zip` |
            | Linux x64 | `tordeX-${{ steps.version.outputs.name }}-linux-x64.tar.gz` |

            ### Installation (Windows)
            1. Download `tordeX-${{ steps.version.outputs.name }}-win-x64.zip`
            2. Extract to any folder
            3. Run `tordeX.exe`
            4. Tor binaries are downloaded automatically on first launch

            ### Installation (Linux)
            1. Download `tordeX-${{ steps.version.outputs.name }}-linux-x64.tar.gz`
            2. Extract: `tar -xzf tordeX-*.tar.gz`
            3. Make executable: `chmod +x tordeX`
            4. Run: `./tordeX`
            5. Tor binaries are downloaded automatically on first launch

            ### Requirements
            - **Windows:** Windows 10 (build 19041) or later, WebView2 Runtime
            - **Linux:** WebKitGTK (`libwebkit2gtk-4.0` or `libwebkit2gtk-4.1`) — install via:
              - Ubuntu/Debian: `sudo apt install libwebkit2gtk-4.1-dev`
              - Fedora: `sudo dnf install webkit2gtk4.1-devel`
              - Arch: `sudo pacman -S webkit2gtk-4.1`

            ### Security
            - 32 security/privacy features enabled
            - AES-256-GCM + Double Ratchet forward secrecy
            - All traffic routed through Tor onion v3
            - SQLCipher encrypted local database
          files: |
            tordeX-*.zip
            tordeX-*.tar.gz
