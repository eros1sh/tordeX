name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive_ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            archive_ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test src/tordeX.Tests/tordeX.Tests.csproj -c Release --no-build --verbosity normal

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "name=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Publish (Self-Contained Single File)
        shell: bash
        run: |
          dotnet publish src/tordeX.Desktop/tordeX.Desktop.csproj \
            -c Release \
            --self-contained \
            -r ${{ matrix.rid }} \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version=${{ steps.version.outputs.name }} \
            -o publish

      - name: Create ZIP archive (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $zipName = "tordeX-${{ steps.version.outputs.name }}-win-x64.zip"
          Compress-Archive -Path "publish\*" -DestinationPath $zipName -Force

      - name: Create tar.gz archive (Linux)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          tar -czf "tordeX-${{ steps.version.outputs.name }}-linux-x64.tar.gz" -C publish .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tordeX-${{ matrix.rid }}
          path: |
            tordeX-*.zip
            tordeX-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "name=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: tordeX ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## tordeX ${{ steps.version.outputs.tag }}

            Decentralized E2E encrypted messenger over Tor.

            ### Downloads

            | Platform | File |
            |----------|------|
            | Windows x64 | `tordeX-${{ steps.version.outputs.name }}-win-x64.zip` |
            | Linux x64 | `tordeX-${{ steps.version.outputs.name }}-linux-x64.tar.gz` |

            ### Installation (Windows)
            1. Download `tordeX-${{ steps.version.outputs.name }}-win-x64.zip`
            2. Extract to any folder
            3. Run `tordeX.exe`
            4. Tor binaries are downloaded automatically on first launch

            ### Installation (Linux)
            1. Download `tordeX-${{ steps.version.outputs.name }}-linux-x64.tar.gz`
            2. Extract: `tar -xzf tordeX-*.tar.gz`
            3. Make executable: `chmod +x tordeX`
            4. Run: `./tordeX`

            > **Note:** Linux build requires a WebView2-compatible runtime. See project README for details.

            ### Requirements
            - **Windows:** Windows 10 (build 19041) or later, WebView2 Runtime
            - **Linux:** .NET 9 compatible distribution

            ### Security
            - 32 security/privacy features enabled
            - AES-256-GCM + Double Ratchet forward secrecy
            - All traffic routed through Tor onion v3
            - SQLCipher encrypted local database
          files: |
            tordeX-*.zip
            tordeX-*.tar.gz
